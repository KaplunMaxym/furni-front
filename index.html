<!doctype html>
<!--
  `class="dark"` стоїть у розмітці, а не ставиться скриптом після старту.

  Інакше перший кадр малювався б у світлій темі — вона в CSS базова, — і
  сторінка блимала б білим перед тим, як застосунок підніме збережений вибір.
  Тим, у кого збережена світла, клас знімає той самий код при старті.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Furni</title>
  </head>
  <body>
    <h1 style="height: 0; overflow: hidden;">Aa1</h1>
    <div id="root"></div>
    <div id="modals-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
